<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QX CHART AI PRO</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#07111f;
  color:#fff;
}

.container{
  max-width:650px;
  margin:auto;
  padding:20px;
}

h1{
  text-align:center;
  margin:10px 0 5px;
  font-size:28px;
}

.subtitle{
  text-align:center;
  color:#9caec4;
  margin-bottom:20px;
}

.card{
  background:#101d2d;
  border:1px solid #26384d;
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
}

.upload{
  border:2px dashed #3d5875;
  border-radius:14px;
  padding:25px 15px;
  text-align:center;
  cursor:pointer;
}

.upload input{
  display:none;
}

#preview{
  display:none;
  width:100%;
  max-height:350px;
  object-fit:contain;
  border-radius:12px;
  margin-top:15px;
}

.btn{
  width:100%;
  border:0;
  border-radius:12px;
  padding:16px;
  margin-top:15px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  background:#1877f2;
  color:white;
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.chat-btn{
  background:#26384d;
}

.status{
  display:none;
  text-align:center;
  padding:15px;
  color:#b9c8d9;
}

.error{
  display:none;
  background:#421b1b;
  color:#ffb4b4;
  padding:12px;
  border-radius:10px;
  margin-top:12px;
}

.result{
  display:none;
}

.signal{
  text-align:center;
  padding:20px;
  border-radius:14px;
  background:#172638;
  margin-bottom:15px;
}

.signal-name{
  font-size:36px;
  font-weight:bold;
}

.up{color:#35d07f}
.down{color:#ff5d6c}
.neutral{color:#ffd166}

.info{
  background:#172638;
  padding:12px;
  border-radius:10px;
  margin-top:10px;
}

.label{
  font-size:12px;
  color:#8fa5bd;
  margin-bottom:5px;
}

.value{
  font-size:15px;
}

.warning{
  color:#aebdcd;
  font-size:12px;
  line-height:1.5;
  margin-top:15px;
  text-align:center;
}
</style>
</head>

<body>

<div class="container">

<h1>🤖 QX CHART AI PRO</h1>
<div class="subtitle">AI Trading Chart Analyzer</div>

<div class="card">

<label class="upload">
  <input type="file" id="file" accept="image/*">
  <div id="uploadText">📤 Chart Screenshot নির্বাচন করুন</div>
  <img id="preview" alt="Chart Preview" style="display:none; width:100%; max-height:350px; object-fit:contain; border-radius:12px; margin-top:15px;">
</label>

<button id="analyzeBtn" class="btn" onclick="startAnalysis()">
  🤖 ANALYZE WITH AI
</button>

<button id="chatBtn" class="btn chat-btn" onclick="chatWithAI()">
  💬 CHAT WITH AI
</button>

<div id="error" class="error"></div>

</div>

<div id="status" class="card status">
  <div id="s1">● Reading chart...</div>
  <div id="s2">● Checking market structure...</div>
  <div id="s3">● Asking AI...</div>
</div>

<div id="result" class="card result">

<div class="signal">
  <div class="label">AI SIGNAL</div>
  <div id="signal" class="signal-name">WAIT</div>
</div>

<div class="info">
  <div class="label">CONFIDENCE</div>
  <div id="confidence" class="value">--</div>
</div>

<div class="info">
  <div class="label">TREND</div>
  <div id="trend" class="value">--</div>
</div>

<div class="info">
  <div class="label">CANDLE STRUCTURE</div>
  <div id="candle" class="value">--</div>
</div>

<div class="info">
  <div class="label">SUPPORT</div>
  <div id="support" class="value">--</div>
</div>

<div class="info">
  <div class="label">RESISTANCE</div>
  <div id="resistance" class="value">--</div>
</div>

<div class="info">
  <div class="label">AI REASON</div>
  <div id="reason" class="value">--</div>
</div>
